name: "Grain Release (Windows)"

# [GRAIN] Windows-only, free release + auto-update pipeline.
#
# Flow: bump `version` in package.json, src-tauri/Cargo.toml,
# src-tauri/Cargo.lock and src-tauri/tauri.conf.json, commit, then run this
# workflow (Actions tab → "Grain Release (Windows)" → Run workflow). It builds
# the NSIS installer, signs the UPDATER artifacts with the minisign key (free —
# no paid code-signing service), and creates a GitHub Release (draft by default)
# containing the installer, its `.sig`, and `latest.json`.
#
# The updater endpoint (tauri.conf.json) points at
# `releases/latest/download/latest.json`. A DRAFT release is not "latest", so
# updates only reach users once you PUBLISH the release — that publish step is
# your final "ship to everyone" gate. After testing the draft installer, run
# "Publish Grain Release" or push `publish-vX.Y.Z` to validate the updater
# assets and make the release public without rebuilding it.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.grain-keys/grain.updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  contents of ~/.grain-keys/grain.updater.key.password
#   GRAIN_GITHUB_OAUTH_CLIENT_ID / GRAIN_GITHUB_OAUTH_CLIENT_SECRET
#     existing desktop registration for the bundled GitHub MCP connection
#   GRAIN_ASANA_OAUTH_CLIENT_ID / GRAIN_ASANA_OAUTH_CLIENT_SECRET
#     Asana "MCP app" registration, distribution "Any workspace". Without
#     them the build hides Asana from Extensions.

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the GitHub release as a draft (publish after testing to ship the update)"
        type: boolean
        default: true
      rerelease:
        description: "Replace an existing public version and move its tag to this verified build"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: grain-windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Enable long paths (Windows)
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate supported GitHub extension registration
        shell: pwsh
        env:
          GRAIN_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GRAIN_GITHUB_OAUTH_CLIENT_ID }}
          GRAIN_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GRAIN_GITHUB_OAUTH_CLIENT_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('GRAIN_GITHUB_OAUTH_CLIENT_ID', 'GRAIN_GITHUB_OAUTH_CLIENT_SECRET')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            $limit = if ($name.EndsWith('_ID')) { 512 } else { 4096 }
            if ([string]::IsNullOrWhiteSpace($value) -or $value.Length -gt $limit -or $value -ne $value.Trim() -or $value -match '[\x00-\x1f\x7f-\x9f]') {
              throw "$name is missing or malformed"
            }
          }
          Write-Host 'Supported GitHub registration is configured; values are not logged'

      # Fails the release before anything is built if the manifests disagree or
      # the updater feed could not be verified -- both are invisible locally and
      # unrecoverable once shipped.
      - name: Verify the release can be updated from
        shell: bash
        run: python scripts/check_release_ready.py

      - name: Get version from tauri.conf.json
        id: version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Load versioned release notes
        id: release_notes
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notesPath = Join-Path $env:GITHUB_WORKSPACE "docs/releases/v$env:RELEASE_VERSION.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) {
            throw "Release notes are missing: $notesPath"
          }
          $notes = Get-Content -LiteralPath $notesPath -Raw -Encoding utf8
          if ([string]::IsNullOrWhiteSpace($notes)) { throw 'Release notes are empty' }
          $delimiter = "GRAIN_RELEASE_NOTES_$([guid]::NewGuid().ToString('N'))"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "body<<$delimiter" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value $notes -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value $delimiter -Encoding utf8

      - name: Check explicitly requested rerelease
        if: github.event_name == 'workflow_dispatch' && inputs.rerelease
        id: rerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
          RELEASE_DRAFT: ${{ inputs.draft }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_DRAFT -ne 'false') { throw 'Rerelease requires draft=false' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Existing release lookup failed' }
          if ($release.draft -or $release.immutable) { throw 'A mutable public release is required' }
          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $ref.object.type -ne 'commit') { throw 'Expected an existing lightweight version tag' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "previous_sha=$($ref.object.sha)"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: windows-x86_64

      - name: Setup Python for native source verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify pinned native fork source and Windows backend features
        shell: bash
        run: |
          python -m unittest discover -s scripts -p test_transcribe_fork.py
          python scripts/transcribe_fork.py --check --metadata --official --target x86_64-pc-windows-msvc

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Normalize Vulkan SDK CMake packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmakeDir = Join-Path $env:VULKAN_SDK "Lib\cmake"
          $packageDir = Join-Path $cmakeDir "SPIRV-Headers"
          $spirvHeadersConfig = Join-Path $packageDir "SPIRV-HeadersConfig.cmake"

          if (-not (Test-Path -LiteralPath $spirvHeadersConfig)) {
            $legacyConfig = Join-Path $cmakeDir "SPIRV-HeadersConfig.cmake"
            $legacyVersion = Join-Path $cmakeDir "SPIRV-HeadersConfigVersion.cmake"
            if (-not (Test-Path -LiteralPath $legacyConfig)) {
              throw "SPIRV-Headers CMake package not found under: $cmakeDir"
            }
            New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
            Copy-Item -LiteralPath $legacyConfig -Destination $packageDir
            if (Test-Path -LiteralPath $legacyVersion) {
              Copy-Item -LiteralPath $legacyVersion -Destination $packageDir
            }
          }

          $prefixPath = $env:VULKAN_SDK
          if ($env:CMAKE_PREFIX_PATH) { $prefixPath = "$prefixPath;$env:CMAKE_PREFIX_PATH" }
          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_PREFIX_PATH=$prefixPath"
          Write-Host "SPIRV-Headers package ready: $spirvHeadersConfig"

      # whisper/ggml cmake builds create paths that exceed Windows MAX_PATH
      # (260 chars). Shorten the target dir to keep paths under the limit.
      - name: Shorten build path (Windows MAX_PATH)
        shell: pwsh
        run: |
          $drive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          $targetDir = "$drive\t"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          echo "CARGO_TARGET_DIR=$targetDir" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        run: bun install

      - name: Prepare and verify updater signing key
        shell: pwsh
        env:
          GRAIN_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GRAIN_UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:GRAIN_UPDATER_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is missing"
          }
          if ([string]::IsNullOrWhiteSpace($env:GRAIN_UPDATER_KEY_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing"
          }

          $encodedKey = $env:GRAIN_UPDATER_KEY.Trim()
          $probePath = Join-Path $env:RUNNER_TEMP "grain-signing-probe.txt"

          try {
            $keyBytes = [Convert]::FromBase64String($encodedKey)
          } catch {
            throw "TAURI_SIGNING_PRIVATE_KEY must contain the Base64 key-file value"
          }
          $decodedKey = [Text.Encoding]::UTF8.GetString($keyBytes).Trim()
          if (-not $decodedKey.StartsWith("untrusted comment:")) {
            throw "Decoded updater key is not a minisign secret key"
          }

          [IO.File]::WriteAllText($probePath, "Grain updater signing probe")
          $env:TAURI_SIGNING_PRIVATE_KEY = $encodedKey
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $env:GRAIN_UPDATER_KEY_PASSWORD
          & bun tauri signer sign $probePath | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Updater signing key validation failed" }

          Remove-Item -LiteralPath $probePath, "$probePath.sig" -Force
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY=$encodedKey"
          Write-Host "Updater signing key validated"

      # Bundle the VC++ runtime app-local so Grain starts on machines without
      # a current Microsoft redistributable (upstream #1577 / issue #1527).
      # build.rs stages msvcp140/vcruntime140/vcomp140 from these dirs into
      # transcribe-libs/, which tauri.windows.conf.json bundles beside the exe.
      - name: Locate VC++ runtime redist for app-local bundling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "vswhere found no Visual Studio installation" }
          $versionFile = Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt"
          $redistVersion = (Get-Content $versionFile).Trim()
          $archDir = Join-Path $vsRoot "VC\Redist\MSVC\$redistVersion\x64"
          if (-not (Test-Path $archDir)) { throw "VC++ redist arch dir not found: $archDir" }
          $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" |
            Sort-Object Name | Select-Object -Last 1
          if (-not $crt -or -not (Test-Path (Join-Path $crt.FullName "msvcp140.dll"))) {
            throw "VC++ CRT redist dir not found or incomplete under: $archDir"
          }
          $omp = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.OpenMP" |
            Sort-Object Name | Select-Object -Last 1
          if (-not $omp -or -not (Test-Path (Join-Path $omp.FullName "vcomp140.dll"))) {
            throw "VC++ OpenMP redist dir not found or incomplete under: $archDir"
          }
          $dirs = "$($crt.FullName);$($omp.FullName)"
          Write-Host "HANDY_VC_REDIST_DIRS=$dirs"
          Add-Content -Path $env:GITHUB_ENV -Value "HANDY_VC_REDIST_DIRS=$dirs"

      - name: Build, sign updater artifacts, and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public/extractable desktop OAuth registration, never account tokens
          # or the GitHub App private key. Used by the bundled GitHub MCP connection.
          GRAIN_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.GRAIN_GITHUB_OAUTH_CLIENT_ID }}
          GRAIN_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.GRAIN_GITHUB_OAUTH_CLIENT_SECRET }}
          # Asana MCP app registration; Asana is hidden in builds without it.
          GRAIN_ASANA_OAUTH_CLIENT_ID: ${{ secrets.GRAIN_ASANA_OAUTH_CLIENT_ID }}
          GRAIN_ASANA_OAUTH_CLIENT_SECRET: ${{ secrets.GRAIN_ASANA_OAUTH_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # CPU-compat: disable AVX/FMA/etc so CPUs lacking them don't SIGILL.
          # The Vulkan backend does the heavy compute, so the perf impact is negligible.
          GGML_NATIVE: "OFF"
          GGML_AVX: "OFF"
          GGML_AVX2: "OFF"
          GGML_FMA: "OFF"
          GGML_F16C: "OFF"
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: v${{ steps.version.outputs.version }}
          releaseDraft: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
          prerelease: false
          releaseBody: ${{ steps.release_notes.outputs.body }}
          # NSIS installer only (matches tauri.conf.json windows.nsis).
          args: "--bundles nsis"

      - name: Verify staged native runtime contract and CPU fallback
        shell: pwsh
        run: python scripts/transcribe_fork.py --runtime-dir src-tauri/transcribe-libs

      - name: Finish explicitly requested rerelease
        if: github.event_name == 'workflow_dispatch' && inputs.rerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.version.outputs.version }}
          PREVIOUS_SHA: ${{ steps.rerelease.outputs.previous_sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $ref.object.sha -ne $env:PREVIOUS_SHA) { throw 'Version tag changed during the build; refusing to retarget it' }
          # GITHUB_TOKEN prevents this tag update from spawning a second release run.
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$env:RELEASE_TAG" -f "sha=$env:SOURCE_SHA" -F force=true --silent
          if ($LASTEXITCODE -ne 0) { throw 'Rerelease tag update failed' }
          $notes = Join-Path $env:RUNNER_TEMP 'grain-rerelease-notes.md'
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json body --jq .body | Set-Content -LiteralPath $notes -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Release notes lookup failed' }
          Add-Content -LiteralPath $notes -Value "`nRebuilt from source $env:SOURCE_SHA. Already on this version? Download and run the rebuilt installer; same-version builds are not offered automatically by the updater."
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Rerelease notes update failed' }
