name: "Grain Release (Windows)"

# [GRAIN] Windows-only, free release + auto-update pipeline.
#
# Flow: bump `version` in src-tauri/tauri.conf.json, commit, then run this
# workflow (Actions tab → "Grain Release (Windows)" → Run workflow). It builds
# the NSIS installer, signs the UPDATER artifacts with the minisign key (free —
# no paid code-signing service), and creates a GitHub Release (draft by default)
# containing the installer, its `.sig`, and `latest.json`.
#
# The updater endpoint (tauri.conf.json) points at
# `releases/latest/download/latest.json`. A DRAFT release is not "latest", so
# updates only reach users once you PUBLISH the release — that publish step is
# your final "ship to everyone" gate. After testing the draft installer, run
# "Publish Grain Release" or push `publish-vX.Y.Z` to validate the updater
# assets and make the release public without rebuilding it.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.grain-keys/grain.updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  contents of ~/.grain-keys/grain.updater.key.password

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the GitHub release as a draft (publish after testing to ship the update)"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Enable long paths (Windows)
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fails the release before anything is built if the manifests disagree or
      # the updater feed could not be verified -- both are invisible locally and
      # unrecoverable once shipped.
      - name: Verify the release can be updated from
        shell: bash
        run: python scripts/check_release_ready.py

      - name: Get version from tauri.conf.json
        id: version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: windows-x86_64

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Normalize Vulkan SDK CMake packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmakeDir = Join-Path $env:VULKAN_SDK "Lib\cmake"
          $packageDir = Join-Path $cmakeDir "SPIRV-Headers"
          $spirvHeadersConfig = Join-Path $packageDir "SPIRV-HeadersConfig.cmake"

          if (-not (Test-Path -LiteralPath $spirvHeadersConfig)) {
            $legacyConfig = Join-Path $cmakeDir "SPIRV-HeadersConfig.cmake"
            $legacyVersion = Join-Path $cmakeDir "SPIRV-HeadersConfigVersion.cmake"
            if (-not (Test-Path -LiteralPath $legacyConfig)) {
              throw "SPIRV-Headers CMake package not found under: $cmakeDir"
            }
            New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
            Copy-Item -LiteralPath $legacyConfig -Destination $packageDir
            if (Test-Path -LiteralPath $legacyVersion) {
              Copy-Item -LiteralPath $legacyVersion -Destination $packageDir
            }
          }

          $prefixPath = $env:VULKAN_SDK
          if ($env:CMAKE_PREFIX_PATH) { $prefixPath = "$prefixPath;$env:CMAKE_PREFIX_PATH" }
          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_PREFIX_PATH=$prefixPath"
          Write-Host "SPIRV-Headers package ready: $spirvHeadersConfig"

      # whisper/ggml cmake builds create paths that exceed Windows MAX_PATH
      # (260 chars). Shorten the target dir to keep paths under the limit.
      - name: Shorten build path (Windows MAX_PATH)
        shell: pwsh
        run: |
          $drive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          $targetDir = "$drive\t"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          echo "CARGO_TARGET_DIR=$targetDir" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        run: bun install

      - name: Prepare and verify updater signing key
        shell: pwsh
        env:
          GRAIN_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          GRAIN_UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:GRAIN_UPDATER_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is missing"
          }
          if ([string]::IsNullOrWhiteSpace($env:GRAIN_UPDATER_KEY_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing"
          }

          $encodedKey = $env:GRAIN_UPDATER_KEY.Trim()
          $probePath = Join-Path $env:RUNNER_TEMP "grain-signing-probe.txt"

          try {
            $keyBytes = [Convert]::FromBase64String($encodedKey)
          } catch {
            throw "TAURI_SIGNING_PRIVATE_KEY must contain the Base64 key-file value"
          }
          $decodedKey = [Text.Encoding]::UTF8.GetString($keyBytes).Trim()
          if (-not $decodedKey.StartsWith("untrusted comment:")) {
            throw "Decoded updater key is not a minisign secret key"
          }

          [IO.File]::WriteAllText($probePath, "Grain updater signing probe")
          $env:TAURI_SIGNING_PRIVATE_KEY = $encodedKey
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $env:GRAIN_UPDATER_KEY_PASSWORD
          & bun tauri signer sign $probePath | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Updater signing key validation failed" }

          Remove-Item -LiteralPath $probePath, "$probePath.sig" -Force
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNING_PRIVATE_KEY=$encodedKey"
          Write-Host "Updater signing key validated"

      # Bundle the VC++ runtime app-local so Grain starts on machines without
      # a current Microsoft redistributable (upstream #1577 / issue #1527).
      # build.rs stages msvcp140/vcruntime140/vcomp140 from these dirs into
      # transcribe-libs/, which tauri.windows.conf.json bundles beside the exe.
      - name: Locate VC++ runtime redist for app-local bundling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "vswhere found no Visual Studio installation" }
          $versionFile = Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt"
          $redistVersion = (Get-Content $versionFile).Trim()
          $archDir = Join-Path $vsRoot "VC\Redist\MSVC\$redistVersion\x64"
          if (-not (Test-Path $archDir)) { throw "VC++ redist arch dir not found: $archDir" }
          $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" |
            Sort-Object Name | Select-Object -Last 1
          if (-not $crt -or -not (Test-Path (Join-Path $crt.FullName "msvcp140.dll"))) {
            throw "VC++ CRT redist dir not found or incomplete under: $archDir"
          }
          $omp = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.OpenMP" |
            Sort-Object Name | Select-Object -Last 1
          if (-not $omp -or -not (Test-Path (Join-Path $omp.FullName "vcomp140.dll"))) {
            throw "VC++ OpenMP redist dir not found or incomplete under: $archDir"
          }
          $dirs = "$($crt.FullName);$($omp.FullName)"
          Write-Host "HANDY_VC_REDIST_DIRS=$dirs"
          Add-Content -Path $env:GITHUB_ENV -Value "HANDY_VC_REDIST_DIRS=$dirs"

      - name: Build, sign updater artifacts, and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # CPU-compat: disable AVX/FMA/etc so CPUs lacking them don't SIGILL.
          # The Vulkan backend does the heavy compute, so the perf impact is negligible.
          GGML_NATIVE: "OFF"
          GGML_AVX: "OFF"
          GGML_AVX2: "OFF"
          GGML_FMA: "OFF"
          GGML_F16C: "OFF"
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: v${{ steps.version.outputs.version }}
          releaseDraft: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
          prerelease: false
          releaseBody: |
            # Grain v0.0.3

            A refinement-focused release across Agent, dictation, streaming UI, updates, and reliability.

            ### What's new

            - Added **image support to Agent**.
            - Added **Gemini support** to the LLM Router and post-processing pipeline.
            - Rebuilt the **Agent UI and overlay** with cleaner layouts, transitions, and animations.
            - Added production **Parakeet TDT Flow**, bringing batch-quality punctuation to sub-second streaming on supported models.
            - Added a dedicated **processing state** to the streaming pill.
            - Improved expanded pill interactions, including working cancel controls, **Prompt Record**, and **Prompt Switching**.
            - Reworked **dictation prompt priority** with a new algorithmic resolution system.
            - Added extension support for **extending or overriding dictation prompts**.
            - Replaced the three default dictation prompts with **one refined default prompt**.
            - Further refined **cursor-aware dictation**.

            ### Fixes & reliability

            - Fixed repeated transcription when dictating inside Agent.
            - Fixed updater launch and restart behavior.
            - Improved how available updates are surfaced in the UI.
            - Fixed waveform rendering with virtual audio devices such as VB-Audio Cable.
            - Reduced false **Lost Text** warnings when text was inserted successfully.
          # NSIS installer only (matches tauri.conf.json windows.nsis).
          args: "--bundles nsis"
