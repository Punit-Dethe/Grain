name: Divergence Ratchet

# Two boundary guards, opposite directions.
#
# `ratchet` — the BACKEND boundary, which Grain keeps merging: fails any push/PR
# that grows a Handy-derived file's divergence from the upstream merge base,
# diverges a core file that had none, or leaves a stray upstream file outside
# src-tauri/src/handy/. See Upstream/ratchet.py.
#
# `frontend-freeze` — the FRONTEND boundary, which Grain stopped merging at the
# UI 2.0 freeze: fails any push/PR where an upstream file lands under src/.
# See Upstream/frontend_freeze.py and docs/UI 2.0/PLAN.md.

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "crates/**"
      - "src/**"
      - "Upstream/relocations.json"
      - "Upstream/verdicts.json"
      - "Upstream/port_audit.py"
      - "Upstream/policy_check.py"
      - "Upstream/UPSTREAM-DIVERGENCE.md"
      - "Upstream/budget.json"
      - "Upstream/ratchet.py"
      - "Upstream/frontend_allow.json"
      - "Upstream/frontend_freeze.py"
  pull_request:
    paths:
      - "src-tauri/**"
      - "crates/**"
      - "src/**"
      - "Upstream/relocations.json"
      - "Upstream/verdicts.json"
      - "Upstream/port_audit.py"
      - "Upstream/policy_check.py"
      - "Upstream/UPSTREAM-DIVERGENCE.md"
      - "Upstream/budget.json"
      - "Upstream/ratchet.py"
      - "Upstream/frontend_allow.json"
      - "Upstream/frontend_freeze.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required for the merge base

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Upstream
        run: |
          git remote add upstream https://github.com/cjpais/handy.git
          git fetch upstream --tags

      - name: Check divergence budgets
        run: python Upstream/ratchet.py

  frontend-freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required for the merge base

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Upstream
        run: |
          git remote add upstream https://github.com/cjpais/handy.git
          git fetch upstream --tags

      - name: Check the frontend freeze
        run: python Upstream/frontend_freeze.py

  runtime-port-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Upstream
        run: |
          git remote add upstream https://github.com/cjpais/handy.git
          git fetch upstream --tags

      - name: Check relocation policy consistency
        run: python Upstream/policy_check.py

      - name: Test upstream process guards
        run: python -m unittest discover -s Upstream/tests -p "test_*.py"

      - name: Check runtime port evidence
        run: python Upstream/port_audit.py --no-fetch

      - name: Check frontend-carried backend knowledge
        if: github.event_name == 'pull_request'
        run: python Upstream/frontend_freeze.py --review-audit "origin/${{ github.base_ref }}"
