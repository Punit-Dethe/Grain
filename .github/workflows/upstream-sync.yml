name: Upstream Sync

# Grain's upstream (Handy) intake, run by tether — see Upstream/UPSTREAM.md.
#
# Each run:
#   1. previews the next sync (`tether sync --dry-run`) and writes the
#      conflict surface, pending security fixes and hand-applied commits into
#      the job summary, so the next sync is always known in advance;
#   2. if upstream has new commits, nothing conflicts and nothing was applied
#      by hand, opens (or updates) an automatic sync PR. Reviewing that PR is
#      the whole sync for the common case. Conflicted syncs are never
#      auto-opened; the runbook takes over.

on:
  schedule:
    - cron: "0 */2 * * *" # Runs every 2 hours
  push:
    branches: [main]
    paths:
      - ".tether/**"
      - ".github/workflows/upstream-sync.yml"
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write

concurrency:
  # A scheduled run and a push run must queue rather than race (both touch
  # the sync branch).
  group: upstream-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: sync/auto-upstream
  TETHER_REV: f89dbc4f1bcdc03ceec0707363cd1cb21fb94b03

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required to find the sync marker

      - name: Cache tether
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tether
          key: tether-${{ runner.os }}-${{ env.TETHER_REV }}

      - name: Install tether
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/Punit-Dethe/tether --rev "$TETHER_REV" tether

      - name: Fetch Upstream
        run: |
          git remote add upstream https://github.com/cjpais/handy.git
          git fetch --quiet upstream
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Preview the next sync
        id: preview
        run: |
          # tether exits 2 when it found something to act on; that is data here.
          tether sync --dry-run --no-fetch --json > /tmp/dry.json || [ $? = 2 ]
          tether inbox --json > /tmp/inbox.json
          BEHIND=$(jq '.data.behind // 0' /tmp/dry.json)
          CONFLICTS=$(jq '.data.conflicts // [] | length' /tmp/dry.json)
          APPLIED=$(jq '[.data.items[] | select(.applied_here)] | length' /tmp/inbox.json)
          {
            echo "# Upstream Sync Report"
            echo
            echo "_Generated by tether; see Upstream/UPSTREAM.md._"
            echo
            echo "- Upstream HEAD: \`$(git rev-parse --short upstream/main)\` — $(git log -1 --format='%s (%ci)' upstream/main)"
            echo "- $(jq -r .summary /tmp/inbox.json)"
            echo "- $(jq -r .summary /tmp/dry.json)"
            if [ "$CONFLICTS" != 0 ]; then
              echo
              echo "**Conflicts that need a person:**"
              echo '```'
              jq -r '.data.conflicts[]' /tmp/dry.json
              echo '```'
            fi
            if [ "$(jq '.data.security | length' /tmp/inbox.json)" != 0 ]; then
              echo
              echo "**Possible security fixes not in Grain yet:**"
              echo '```'
              jq -r '.data.items[] | select(.security) | "\(.sha[:12]) \(.subject)  [\(.security | join(", "))]"' /tmp/inbox.json
              echo '```'
            fi
            if [ "$APPLIED" != 0 ]; then
              echo
              echo "**Already applied by hand (record with \`tether decide <sha> merged\`):**"
              echo '```'
              jq -r '.data.items[] | select(.applied_here) | "\(.sha[:12]) \(.subject)"' /tmp/inbox.json
              echo '```'
            fi
          } > /tmp/report.md
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "conflicts=$CONFLICTS" >> "$GITHUB_OUTPUT"
          echo "applied=$APPLIED" >> "$GITHUB_OUTPUT"

      - name: Open or update the automatic sync PR
        if: >-
          steps.preview.outputs.behind != '0' &&
          steps.preview.outputs.conflicts == '0' &&
          steps.preview.outputs.applied == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git checkout -B "$SYNC_BRANCH" HEAD
          jq -r '.data.items[] | select(.state == "pending") | "\(.sha[:12]) \(.subject)"' /tmp/inbox.json | head -30 > /tmp/commits.txt
          # One squashed, single-parent commit carrying Upstream-Synced: <sha>.
          tether sync --no-fetch || [ $? = 2 ]
          tether sync --continue --json > /tmp/done.json
          if [ -n "$(git status --porcelain -- .tether/rr-cache)" ]; then
            git add .tether/rr-cache
            git commit -m "chore(upstream): share new rerere resolutions"
          fi
          # The boundary must hold on the merged result: what still needs a
          # record (ports, reviews) is listed in the PR, not hidden.
          tether check --json > /tmp/check.json || true
          tether check > /tmp/check.txt || true
          git push -f origin "$SYNC_BRANCH"
          {
            echo "Automatic upstream sync by tether — applied cleanly."
            echo
            echo '```'
            cat /tmp/commits.txt
            echo '```'
            echo
            echo "### tether check on the merged result"
            echo '```'
            cat /tmp/check.txt
            echo '```'
            echo
            echo "Before merging:"
            echo "- [ ] CI green (build, tests, Upstream Check)"
            echo "- [ ] \`tether status\` is clean: every port, review and marker it asks for is recorded"
            echo "      (\`tether packet <sha>\` shows what each one needs)."
            echo "- [ ] Anything **not** simply merged? \`tether decide <sha> ignored --note \"why\"\`."
            echo "- [ ] New settings/bindings? Export \`src/app/bindings.ts\` and check settings parity"
            echo "- [ ] Recording/capture/overlay changes? Follow [OVERLAY-MAINTENANCE.md](Upstream/OVERLAY-MAINTENANCE.md)"
            echo
            echo "Merge with a merge commit or rebase — **never squash**: the sync"
            echo "commit's \`Upstream-Synced:\` line must reach main unchanged, or the"
            echo "next sync re-fights these commits."
          } > /tmp/body.md
          if gh pr view "$SYNC_BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$SYNC_BRANCH" --body-file /tmp/body.md
          else
            gh pr create --head "$SYNC_BRANCH" \
              --title "sync: Handy upstream/main (auto)" --body-file /tmp/body.md
          fi
          git checkout main
