name: Upstream Sync

# Grain's upstream (Handy) intake, end to end — see Upstream/UPSTREAM.md.
#
# This workflow both BUILDS the tracker and PUBLISHES it, in one job. That is
# deliberate: it used to commit the generated files and let a second, push-
# triggered workflow deploy them — but GitHub never fires `on: push` for a push
# made with GITHUB_TOKEN, so the site only ever refreshed when a human happened
# to push something under Upstream/. Building and deploying in the same run
# removes the chain instead of patching it.
#
# Nothing is committed. Upstream/data.json, data.js, status.json and
# merge-report.md are gitignored build products, regenerated from upstream's
# commit list, our git ancestry, and the human-owned Upstream/verdicts.json.
#
# Each run:
#   1. trial-merges upstream/main and writes merge-report.md + status.json, so
#      the next sync's conflict surface is always known in advance;
#   2. rebuilds the ledger and audits ancestry drift;
#   3. publishes the dashboard to GitHub Pages.
#
# This workflow is READ-ONLY with respect to the repository: it never commits,
# pushes a branch, or opens a PR. It only SURFACES upstream state as data (the
# dashboard, status.json, merge-report.md, and the run summary). Absorbing
# upstream is a deliberate, human-driven step — follow Upstream/UPSTREAM.md
# (preflight + merge_upstream). `contents: read` enforces this at the permission
# level, so no future edit can reintroduce an auto-commit by accident.

on:
  schedule:
    - cron: '0 */2 * * *' # Runs every 2 hours
  push:
    # A human recording a verdict republishes immediately. (Human pushes do
    # trigger workflows; the bot's would not — which is why it no longer pushes.)
    branches: [main]
    paths:
      - 'Upstream/**'
      - '.github/workflows/upstream-sync.yml'
  workflow_dispatch: # Allows manual trigger from GitHub UI

# Read-only on repo contents by design: this workflow surfaces upstream state,
# it never writes to the repo. `pages`/`id-token` are only for the dashboard
# deploy (an artifact upload, not a commit).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pages allows one deployment at a time; a scheduled run and a push run must
  # queue rather than race.
  group: github-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history required for the trial merge and the ancestry audit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Upstream
        run: |
          git remote add upstream https://github.com/cjpais/handy.git
          git fetch upstream --tags

      - name: Configure merge machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          # Map upstream's files into src-tauri/src/handy/ (the phase-7 layout)
          # aggressively rather than conservatively.
          git config merge.directoryRenames true
          # Reuse every conflict resolution ever recorded by this repo.
          git config rerere.enabled true
          git config rerere.autoupdate true
          python Upstream/rerere_cache.py restore || true

      - name: Trial Merge Report
        id: trial
        run: |
          BASE=$(git merge-base HEAD upstream/main || true)
          REPORT="Upstream/merge-report.md"
          STATUS="Upstream/status.json"
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          CONFLICTS=""
          {
            echo "# Upstream Merge Report"
            echo
            echo "_Auto-generated by upstream-sync; do not edit. See Upstream/UPSTREAM.md._"
            echo
            echo "- Upstream HEAD: \`$(git rev-parse --short upstream/main)\` — $(git log -1 --format='%s (%ci)' upstream/main)"
            echo "- Latest upstream tag: \`$(git describe --tags --abbrev=0 upstream/main 2>/dev/null || echo none)\`"
          } > "$REPORT"

          CLEAN=false
          if [ -z "$BASE" ]; then
            echo "- **No merge base found — cannot trial-merge.**" >> "$REPORT"
          else
            echo "- Merge base: \`$(git rev-parse --short $BASE)\`" >> "$REPORT"
            echo "- Unmerged upstream commits: $BEHIND" >> "$REPORT"
            if git merge --no-commit --no-ff upstream/main > /dev/null 2>&1; then
              echo "- **Trial merge: CLEAN — no conflicts.**" >> "$REPORT"
              CLEAN=true
            else
              CONFLICTS=$(git diff --name-only --diff-filter=U | sort)
              COUNT=$(echo "$CONFLICTS" | grep -c . || true)
              {
                echo "- **Trial merge: $COUNT conflicting file(s):**"
                echo
                echo '```'
                echo "$CONFLICTS"
                echo '```'
                echo
                echo "Resolve per the divergence map (Upstream/UPSTREAM-DIVERGENCE.md)."
              } >> "$REPORT"
            fi
            git merge --abort 2>/dev/null || git reset --hard HEAD
          fi
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          echo "clean=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"

          # Machine-readable twin of the report: the dashboard renders this so
          # "are we keeping up?" is answerable without reading CI logs.
          UPSTREAM_HEAD="$(git rev-parse --short upstream/main)" \
          UPSTREAM_SUBJECT="$(git log -1 --format='%s' upstream/main)" \
          UPSTREAM_DATE="$(git log -1 --format='%cI' upstream/main)" \
          LATEST_TAG="$(git describe --tags --abbrev=0 upstream/main 2>/dev/null || echo none)" \
          MERGE_BASE="$(test -n "$BASE" && git rev-parse --short "$BASE" || echo '')" \
          BEHIND="$BEHIND" CLEAN="$CLEAN" CONFLICTS="$CONFLICTS" \
          python - <<'PY' > "$STATUS"
          import json, os
          conflicts = [f for f in os.environ["CONFLICTS"].split("\n") if f.strip()]
          print(json.dumps({
              "upstream_head": os.environ["UPSTREAM_HEAD"],
              "upstream_subject": os.environ["UPSTREAM_SUBJECT"],
              "upstream_date": os.environ["UPSTREAM_DATE"],
              "latest_tag": os.environ["LATEST_TAG"],
              "merge_base": os.environ["MERGE_BASE"],
              "behind": int(os.environ["BEHIND"]),
              "trial_clean": os.environ["CLEAN"] == "true",
              "conflicts": conflicts,
          }, indent=2))
          PY

      # Ledger + ancestry audit. Runs BEFORE the PR step because it detects
      # already-applied commits (cherry-picked work git has no ancestry for) —
      # auto-merging those would replay resolved work and its conflicts.
      - name: Rebuild ledger and audit ancestry
        id: ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Without pipefail the pipe reports tee's status, so a crashed
          # scraper looked like a successful sync that found nothing.
          set -o pipefail
          python Upstream/sync_upstream.py | tee /tmp/ledger.txt
          if grep -q "ALREADY APPLIED" /tmp/ledger.txt; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            {
              echo
              echo "## Ancestry drift"
              echo '```'
              cat /tmp/ledger.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      # Publish in this same run, and BEFORE the PR step: the generated files
      # are never committed, so this is the only thing that puts them in front
      # of anyone, and a red ratchet must not also cost us the dashboard.
      # A failed ledger step skips these, leaving the last good site up.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload upstream tracker
        uses: actions/upload-pages-artifact@v3
        with:
          path: Upstream

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # NOTE: this workflow used to open/update an automatic `sync/auto-upstream`
      # PR here — merging upstream, committing shared rerere resolutions, and
      # force-pushing a branch. That auto-commit was removed deliberately: intake
      # is human-driven so any change is easy to attribute and revert. The trial
      # report, ledger, ancestry audit and dashboard above still surface exactly
      # when and what to merge; do it locally with Upstream/preflight.py +
      # Upstream/merge_upstream.py. Do NOT reintroduce a commit/push/PR step —
      # `contents: read` (above) would fail it anyway.
