name: "Build Test"

on:
  workflow_dispatch:
    inputs:
      windows-only:
        description: "Build only the normal Windows beta installer"
        type: boolean
        default: false
      macos-only:
        description: "Build only the Apple Silicon and Intel macOS test installers"
        type: boolean
        default: false

jobs:
  build-test:
    if: ${{ !inputs.windows-only && !inputs.macos-only }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04" # Build .deb on 22.04
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04" # Build AppImage and RPM on 24.04
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm" # Build for ARM64 Linux
            args: "--bundles appimage,deb,rpm"
            target: "aarch64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm" # for ARM64 Windows runner
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: true
      asset-prefix: "handy-test"
      upload-artifacts: true
      is-debug-build: ${{ contains(matrix.args, '--debug') }}
    secrets: inherit

  macos-build:
    if: ${{ !inputs.windows-only }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-26
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: --target ${{ matrix.target }}
      sign-binaries: false
      asset-prefix: grain-macos-test
      upload-artifacts: true

  windows-beta:
    if: ${{ inputs.windows-only }}
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      build-args: "--bundles nsis"
      is-debug-build: false
      asset-prefix: handy-test
      upload-artifacts: true
      sign-binaries: true
    secrets: inherit

