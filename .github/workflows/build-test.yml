name: "Build Test"

on:
  workflow_dispatch:
    inputs:
      windows-only:
        description: "Build only the normal Windows beta installer"
        type: boolean
        default: false
      linux-only:
        description: "Build Linux deb, AppImage and RPM test artifacts"
        type: boolean
        default: false

jobs:
  build-test:
    if: ${{ !inputs.windows-only && !inputs.linux-only }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26" # for Arm based macs (M1 and above). Uses macOS 26 for Apple Intelligence SDK.
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # Build .deb on 22.04
            args: "--bundles deb"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04" # Build AppImage and RPM on 24.04
            args: "--bundles appimage,rpm"
            target: "x86_64-unknown-linux-gnu"
          - platform: "ubuntu-24.04-arm" # Build for ARM64 Linux
            args: "--bundles appimage,deb,rpm"
            target: "aarch64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm" # for ARM64 Windows runner
            args: "--target aarch64-pc-windows-msvc"
            target: "aarch64-pc-windows-msvc"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      # macOS test packages use ad hoc signing so the build can be tested
      # even while the Developer ID certificate is unavailable.
      sign-binaries: ${{ !contains(matrix.platform, 'macos') }}
      asset-prefix: "handy-test"
      upload-artifacts: true
      is-debug-build: ${{ contains(matrix.args, '--debug') }}
    secrets: inherit

  linux-build:
    if: ${{ inputs.linux-only && !inputs.windows-only }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb"
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-24.04
            args: "--bundles appimage,rpm"
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-24.04-arm
            args: "--bundles appimage,deb,rpm"
            target: aarch64-unknown-linux-gnu
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      sign-binaries: true
      asset-prefix: grain-linux-test
      upload-artifacts: true
    secrets: inherit

  windows-beta:
    if: ${{ inputs.windows-only }}
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      build-args: "--bundles nsis"
      is-debug-build: false
      asset-prefix: handy-test
      upload-artifacts: true
      sign-binaries: true
    secrets: inherit

