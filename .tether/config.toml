[upstream]
remote = "upstream"
branch = "main"
name = "Handy"
url = "https://github.com/cjpais/handy"
since = "2026-06-11T00:50:36Z"

[[moved]]
fork = "src-tauri/src/handy/"
upstream = "src-tauri/src/"
stay = ["src-tauri/src/lib.rs", "src-tauri/src/main.rs"]

# The frozen frontend moved to src/app/; mapping it lets tether spot
# upstream frontend work that rename detection routes in there.
[[moved]]
fork = "src/app/"
upstream = "src/"

# The frontend is Grain-owned and frozen (AGENTS.md): upstream frontend changes
# never merge, even new files git routes into src/app/ by directory rename.
# The [[review]] "frontend" group still surfaces them for backend porting.
[[owned]]
path = "src/"

[[review]]
name = "frontend"
paths = ["src/*"]

[[review]]
name = "suppressed"
paths = ["README.md", "AGENTS.md", "CLAUDE.md", "CRUSH.md", "BUILD.md", "CONTRIBUTING.md", "CONTRIBUTING_TRANSLATIONS.md", "docs/*", "website/*", ".github/workflows/*", "src-tauri/tauri.conf.json", "src-tauri/tauri.windows.conf.json", "bun.lock", "Cargo.lock", "src-tauri/Cargo.lock", ".nix/bun.nix", ".nix/bun-lock-hash", "scripts/gen_catalog.py", "scripts/ci/stage-transcribe-libs.sh"]

[budget]
scope = ["src-tauri/"]
exclude = ["src-tauri/Cargo.lock"]

[port_audit]
notes_accepted_through = "98a4d80cce8ad41efec2a419b59d9e81229a35d7"
deferred_queue = "Upstream/DEFERRED-PORTS.md"

# Every Grain change inside Handy-derived code says why: `// [GRAIN] <why>`.
[map]
marker = "[GRAIN]"

# Merge settings every clone and CI runner use for a sync, and the
# shared rerere resolutions (formerly Upstream/rr-cache).
[sync]
rerere_cache = ".tether/rr-cache"

[sync.git_config]
"merge.directoryRenames" = "true"
"merge.ours.driver" = "true"

[relocations."src-tauri/src/actions.rs"]
kind = "relocated"
fork = ["src-tauri/src/grain_post_process.rs", "src-tauri/src/grain_actions.rs", "src-tauri/src/grain_capture.rs", "src-tauri/src/grain_overlay.rs", "crates/grain-core/src/capture.rs", "src-tauri/src/grain_dictation_routing.rs", "src/app/components/settings/capture/CaptureModes.tsx"]
why = "Merged in handy/ for its shape, BUT post_process_transcription is relocated to grain_post_process.rs and Grain's action variants live in grain_actions.rs. A fix to post-processing or the finish/guard flow may need porting there (e.g. #1846 trim_freed_memory in FinishGuard::drop did not auto-merge into the diverged actions.rs). Dictation now resolves Standard/Flow through grain-core capture policy and grain_dictation_routing at coordinator start, retaining the action through stop/PTT; upstream capture changes must preserve that seam."

[relocations."src-tauri/src/audio_toolkit/audio/sink.rs"]
kind = "parallel"
fork = ["src-tauri/src/handy/managers/audio.rs", "src-tauri/src/grain_capture.rs", "src-tauri/src/grain_audio_journal.rs", "src-tauri/src/grain_actions.rs", "src-tauri/src/grain_audio.rs", "src-tauri/src/grain_audio_manager.rs"]
why = "Handy recorder is now a dependency; the shared CaptureSink is the Grain journal/retention seam. Review first-sample acknowledgement, partial valid tail, disabled VAD, frame geometry, Prompt Record marks, cancellation and disconnect cleanup across Grain callers."

[relocations."src-tauri/src/audio_toolkit/text.rs"]
kind = "relocated"
fork = ["src-tauri/src/handy/audio_toolkit/grain_text.rs"]
why = "finalize_transcript relocated to grain_text.rs; final-text / word-boundary fixes may belong there rather than the merged handy text.rs."

[relocations."src-tauri/src/llm_client.rs"]
kind = "inert"
fork = ["src-tauri/src/grain_llm_client.rs", "src-tauri/src/net_diag.rs", "src-tauri/src/grain_llm_fallback.rs", "src-tauri/src/grain_post_process.rs", "src-tauri/src/agent.rs"]
why = "Inert (no `mod llm_client;`). Grain uses grain_llm_client.rs and shared payload-safe reqwest diagnostics in net_diag.rs. Cloud speech-to-text was removed on 2026-10-04. LLM requests use optional stateless fallback in saved provider order. Review transport/response fixes against post-processing and Agent plain/image/tool paths; preserve per-attempt timeout and stop at first successful reply. See Upstream/LLM-FALLBACK.md."

[relocations."src-tauri/src/managers/audio.rs"]
kind = "relocated"
fork = ["src-tauri/src/grain_capture.rs", "src-tauri/src/grain_actions.rs", "src-tauri/src/agent.rs", "src-tauri/src/grain_onboarding.rs", "src-tauri/src/grain_audio.rs", "src-tauri/src/grain_audio_manager.rs"]
why = "Shared RecordingReadiness/capture-generation API is consumed by Grain startup, feedback, failure and cancellation adapters across every capture family. Review these callers when upstream changes stream startup, disconnect recovery, readiness, stop or mute."

[relocations."src-tauri/src/managers/transcription.rs"]
kind = "parallel"
fork = ["src-tauri/src/rolling.rs", "src-tauri/src/tdt_flow.rs", "crates/grain-tdt/src", "src-tauri/src/grain_overlay.rs", "src/app/overlay/RecordingOverlay.tsx", "src-tauri/src/grain_transcription.rs", "src-tauri/src/grain_transcription_manager.rs", "src-tauri/src/grain_engine.rs", "src-tauri/src/context_bias.rs"]
why = "Merged in handy/, but Parakeet TDT Flow has Grain-only capture scheduling, native adaptation, and window/token logic that upstream's batch/streaming fixes cannot reach. Check whether the fixed bug-class exists there too. Local batch callers share Grain's grain_transcription adapter; it delegates loading, inference and final cleanup to the shared manager."

[relocations."src-tauri/src/overlay.rs"]
kind = "relocated"
fork = ["src-tauri/src/handy/overlay.rs", "src-tauri/src/grain_overlay.rs", "src-tauri/src/grain_capture.rs", "src/app/overlay/RecordingOverlay.tsx", "src/app/overlay/wave.ts", "src/app/overlay/overlay.css", "src-tauri/src/grain_events.rs", "recording-overlay.html", "vite.config.ts", "src-tauri/src/pill_icon.rs", "src-tauri/src/surface_watch.rs", "src/app/overlay/main.tsx", "crates/grain-sdk/src/event.rs"]
why = "Handy overlay.rs is compiled directly again: native window, platform geometry, nonactivation, readiness events, audio throttling and hide generations are shared. Grain capture modes/context/icon/clipboard/follow-up adapters and owned visual/waveform presentation are listed here; relevant behavior changes require checking these destinations while the frontend freeze remains in force. See Upstream/OVERLAY-MAINTENANCE.md for the event, settings, lifecycle and acceptance contract."

[relocations."src-tauri/src/settings.rs"]
kind = "inert"
fork = ["src-tauri/src/grain_settings.rs", "crates/grain-core/src/settings.rs", "crates/grain-core/src/context.rs", "src/app/components/settings/ShowOverlay.tsx", "src/app/components/settings/PillCloseButton.tsx", "src/app/components/settings/PillAppIcon.tsx", "src/app/stores/settingsStore.ts", "crates/grain-core/src/capture.rs", "src-tauri/src/grain_dictation_routing.rs", "src/app/components/settings/capture/CaptureModes.tsx", "crates/grain-core/src/providers.rs", "src-tauri/src/grain_provider_commands.rs", "src/app/stores/ppPoolStore.ts", "src/app/components/settings/post-processing/pool/PostProcessingPool.tsx", "src/app/components/settings/experimentations/AgentSection.tsx", "src/app/components/settings/DecodeSettings.tsx"]
why = "Inert (no `mod settings;`). Grain's settings are grain-core AppContext; a NEW upstream setting must be added there and to its Default, or `get_settings().<field>` in merged handy code fails to compile. (#1254 selected_channel needed this.) Provider participation and order are persisted through Grain commands; smart rotation and quotas are retired. Preserve the exact-permutation reorder validation and credential boundary in Upstream/LLM-FALLBACK.md. Automatic Agent text context was retired on 2026-10-04; do not restore agent_context_mode or field/unique/window background capture when porting settings. Dictation caret context and extension screenText remain active; see Upstream/AGENT-TEXT-CONTEXT.md."

[relocations."src-tauri/src/transcription_coordinator.rs"]
kind = "relocated"
fork = ["src-tauri/src/handy/transcription_coordinator.rs", "src-tauri/src/grain_coordinator.rs", "src-tauri/src/grain_dictation_routing.rs", "src-tauri/src/grain_shortcuts.rs"]
why = "Handy owns the production CoordinatorState, grace/debounce/hold/busy-input transitions and sequence tests. Grain delegates runtime effects and alternate AI finish to an owned include so capture admission and the action resolved at start survive through stop. Review both shared transitions and owned effects when upstream changes coordinator behavior."
