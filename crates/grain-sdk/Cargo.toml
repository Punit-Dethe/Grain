[package]
name = "grain-sdk"
version = "0.1.0"
description = "Shared Grain desktop events and MCP connection contracts."
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true }
# Type reflection so settings-visible types (OverlayPosition) keep generating
# frontend bindings exactly as before the move out of grain-core.
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
