[package]
name = "grain-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Headless, Tauri-free core for Grain: AppContext (owned settings + event bus + paths), the DaemonEvent stream, and the production settings store (owned JSON, secrets in a separate credential file)."

[dependencies]
# The public wire contract (dependency LEAF - SPEC 7.3): events, actions,
# handshake. grain-core re-exports its types so existing paths keep working.
grain-sdk = { path = "../grain-sdk" }
serde = { workspace = true }
serde_json = { workspace = true }
# Reuse the desktop's locked URL parser; validation performs no network/DNS.
url = "=2.5.8"
http = "1"
# Tool schemas are untrusted: no HTTP/file resolver or additional TLS runtime.
jsonschema = { version = "=0.58.1", default-features = false }
anyhow = { workspace = true }
log = "0.4"
# broadcast channel for the DaemonEvent bus (no Tauri).
tokio = { version = "1", features = ["sync"] }
# OS locale for the app_language default (replaces tauri_plugin_os::locale).
sys-locale = "0.3"
# Type reflection for the eventual frontend bindings — standalone, not Tauri.
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
sha2 = "0.10"                                   # match src-tauri (one copy)
# Private, create-new staging directories with scoped cleanup (already locked).
tempfile = "3"
# Host-generated connection/account/restart identities; match desktop's lock.
uuid = { version = "=1.21.0", features = ["v4"] }
