[package]
name = "grain-flow-audit"
version = "0.1.0"
edition = "2021"
publish = false

# Offline evaluation only; never linked into the application.
[workspace]

[dependencies]
grain-tdt = { path = "../../crates/grain-tdt" }
transcribe-cpp = { version = "=0.4.0", default-features = false, features = ["dynamic-backends"] }
hound = "3.5"
serde_json = "1"

[patch.crates-io]
transcribe-cpp = { git = "https://github.com/Punit-Dethe/transcribe.cpp.git", rev = "eeffcc3887018015d04d20e61d3698a33d790f24" }
transcribe-cpp-sys = { git = "https://github.com/Punit-Dethe/transcribe.cpp.git", rev = "eeffcc3887018015d04d20e61d3698a33d790f24" }
