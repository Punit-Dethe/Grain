[package]
name = "grain-flow-audit"
version = "0.1.0"
edition = "2021"
publish = false

# Offline evaluation only; never linked into the application.
[workspace]

[dependencies]
grain-tdt = { path = "../../crates/grain-tdt" }
transcribe-cpp = { version = "=0.2.3", default-features = false, features = ["dynamic-backends"] }
hound = "3.5"
serde_json = "1"

[patch.crates-io]
transcribe-cpp = { git = "https://github.com/Punit-Dethe/transcribe.cpp.git", rev = "7be200645db2e9296b08794c615a3e346f1b17f4" }
transcribe-cpp-sys = { git = "https://github.com/Punit-Dethe/transcribe.cpp.git", rev = "7be200645db2e9296b08794c615a3e346f1b17f4" }
