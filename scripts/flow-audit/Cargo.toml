[package]
name = "grain-flow-audit"
version = "0.1.0"
edition = "2021"
publish = false

# Offline evaluation only; never linked into the application.
[workspace]

[dependencies]
grain-tdt = { path = "../../crates/grain-tdt" }
transcribe-cpp = { version = "=0.2.3", default-features = false, features = ["dynamic-backends"] }
hound = "3.5"
serde_json = "1"

[patch.crates-io]
transcribe-cpp = { git = "https://github.com/Punit-Dethe/transcribe.cpp.git", rev = "2d336ea878ded786f63dd53520beed8fc6192c61" }
transcribe-cpp-sys = { git = "https://github.com/Punit-Dethe/transcribe.cpp.git", rev = "2d336ea878ded786f63dd53520beed8fc6192c61" }
